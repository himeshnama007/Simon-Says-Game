<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Simon Says</h1>
        <p class="subtitle">Press any key to start the game</p>
        <div class="score-box">
            <span>Level:</span>
            <span id="level">0</span>
        </div>
        <div class="game-board">
            <button class="btn red" id="red"></button>
            <button class="btn yellow" id="yellow"></button>
            <button class="btn green" id="green"></button>
            <button class="btn purple" id="purple"></button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
